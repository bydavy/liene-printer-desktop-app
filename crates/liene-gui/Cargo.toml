[package]
name = "liene-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Desktop app for Liene/Hannto photo printers"

[[bin]]
name = "open-desktop"
path = "src/main.rs"

[[bin]]
name = "open-liene-control"
path = "src/bin/open-liene-control.rs"

[dependencies]
anyhow = "1"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
liene-client = { path = "../liene-client" }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
