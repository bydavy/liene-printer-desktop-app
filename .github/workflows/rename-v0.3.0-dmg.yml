name: Rename v0.3.0 macOS DMG asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-v0.3.0-dmg.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rename the DMG and checksum assets
        run: |
          set -euo pipefail
          tag=v0.3.0
          old=Liene-Desktop-App-0.3.0.dmg
          new=Liene-Desktop-App-0.3.0-macos.dmg

          gh api "repos/$GH_REPO/releases/tags/$tag" > release.json
          dmg_id=$(jq -r --arg n "$old" '.assets[] | select(.name == $n) | .id' release.json)
          sha_id=$(jq -r --arg n "$old.sha256" '.assets[] | select(.name == $n) | .id' release.json)

          if [ -z "$dmg_id" ] || [ -z "$sha_id" ]; then
            echo "Assets already renamed or missing; nothing to do."
            exit 0
          fi

          # Rename the DMG in place.
          gh api -X PATCH "repos/$GH_REPO/releases/assets/$dmg_id" \
            -f name="$new" >/dev/null

          # The checksum file embeds the filename, so rebuild and re-upload it.
          gh api -H "Accept: application/octet-stream" \
            "repos/$GH_REPO/releases/assets/$sha_id" > "$old.sha256"
          sed -i "s/$old/$new/g" "$old.sha256"
          gh api -X DELETE "repos/$GH_REPO/releases/assets/$sha_id"
          cp "$old.sha256" "$new.sha256"
          gh release upload "$tag" "$new.sha256" --repo "$GH_REPO"

          echo "Renamed $old -> $new"
