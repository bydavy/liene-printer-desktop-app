name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS universal DMG (tested)
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build universal app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -o pipefail
          ./scripts/bundle-macos.sh --universal 2>&1 | tee "$RUNNER_TEMP/bundle.log"

      - name: Report bundle failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/bundle.log" ]]; then
            tail -100 "$RUNNER_TEMP/bundle.log" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=universal-bundle::$line"
            done
          fi

      - name: Verify universal binaries
        run: |
          lipo -info "dist/Open Liene.app/Contents/MacOS/open-desktop"
          lipo -info "dist/Open Liene.app/Contents/MacOS/open-liene-cli"
          codesign --verify --deep --strict "dist/Open Liene.app"

      - name: Build DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/Open-Liene-*-macos.dmg
            dist/Open-Liene-*-macos.dmg.sha256
          if-no-files-found: error

  linux:
    name: Linux package (untested)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev pkg-config \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Package Linux artifact (untested)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/bundle-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/Open-Liene-*.tar.gz
            dist/Open-Liene-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows package (untested)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Package Windows artifact (untested)
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/bundle-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/Open-Liene-*.zip
            dist/Open-Liene-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Open-Liene-*-macos.dmg
            dist/Open-Liene-*-macos.dmg.sha256
            dist/Open-Liene-*.tar.gz
            dist/Open-Liene-*.tar.gz.sha256
            dist/Open-Liene-*.zip
            dist/Open-Liene-*.zip.sha256
          fail_on_unmatched_files: true
          body: |
            ## Open Liene ${{ needs.prepare.outputs.version }}

            **macOS 13+ universal DMG** (Apple Silicon + Intel) — hardware-tested
            on the N200 Pro. The app is ad-hoc signed, not notarized. On first
            launch, right-click the app and choose Open, or clear quarantine:

                xattr -dr com.apple.quarantine "/Applications/Open Liene.app"

            **Linux x86_64 tar.gz** — **UNTESTED**. Pair with BlueZ
            (`bluetoothctl --timeout 30 pair <MAC>`, `trust <MAC>`, `connect <MAC>`),
            extract, and run `./run.sh`. Help wanted.

            **Windows x86_64 zip** — **UNTESTED**. Pair in Settings → Bluetooth &
            devices, keep both `.exe` files together, and run
            `open-desktop.exe`. SmartScreen may warn because it is unsigned.
            Help wanted.

            Testers with other Liene/Hannto printers: please open a
            [Printer support report](https://github.com/bydavy/open-liene-printer-desktop/issues/new?template=printer-support.md)
            with model, PID, firmware, OS, and a `--debug` log.

            See the README for pairing, editing, CLI usage, and SHA-256
            verification.
